# Documentation site, built by Read the Docs (see .readthedocs.yaml) and in CI with
# `mkdocs build --strict`. docs/ is the whole site; the repository README stays the
# landing page on the forge and is deliberately not duplicated here.
site_name: gpygap
site_description: Offline PyPI mirror of the most popular projects, for air-gapped networks
copyright: Copyright &copy; 2026 <a href="https://fpgartktic.github.io/">Mateusz Okulanis</a> &middot; GPL-3.0-or-later

site_url: https://gpygap.readthedocs.io/
docs_dir: docs
repo_url: https://github.com/FPGArtktic/gpygap
repo_name: FPGArtktic/gpygap
edit_uri: edit/main/docs/

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/package-variant-closed
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FPGArtktic/gpygap
      name: gpygap on GitHub
    - icon: material/web
      link: https://fpgartktic.github.io/
      name: fpgartktic.github.io
  generator: false

# Explicit, in the reading order index.md recommends. A page missing from here is a
# warning, and --strict turns warnings into failures: adding a doc means adding it below.
nav:
  - Home: index.md
  - How it works:
      - architecture.md
      - pipeline.md
      - wheels.md
      - verification.md
      - advisories.md
      - file-formats.md
  - Running it:
      - setups.md
      - operations.md
      - online-on-windows.md
  - Contributing:
      - development.md
      - ci.md
      - decisions.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.smartsymbols
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        # Diagrams are written as ```mermaid fences and render in the browser, so a
        # class or activity diagram is reviewed as a diff like everything else.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css
