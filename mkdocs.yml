# Documentation site, built by Read the Docs (see .readthedocs.yaml) and in CI with
# `mkdocs build --strict`. docs/ is the whole site; the repository README stays the
# landing page on the forge and is deliberately not duplicated here.
site_name: gpygap
site_description: Offline PyPI mirror of the most popular projects, for air-gapped networks
copyright: Copyright &copy; 2026 <a href="https://fpgartktic.github.io/">Mateusz Okulanis</a> &middot; GPL-3.0-or-later

site_url: https://gpygap.readthedocs.io/
docs_dir: docs
repo_url: https://github.com/FPGArtktic/gpygap
repo_name: FPGArtktic/gpygap
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/package-variant-closed
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/FPGArtktic/gpygap
      name: gpygap on GitHub
    - icon: material/web
      link: https://fpgartktic.github.io/
      name: fpgartktic.github.io
  generator: false

# Explicit, in the reading order index.md recommends. A page missing from here is a
# warning, and --strict turns warnings into failures: adding a doc means adding it below.
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - The pipeline, end to end: pipeline.md
  - Wheels we build: wheels.md
  - Verification: verification.md
  - Known vulnerabilities: advisories.md
  - Files and formats: file-formats.md
  - Operations: operations.md
  - Online side on Windows: online-on-windows.md
  - Development: development.md
  - Design decisions: decisions.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.smartsymbols
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        # Diagrams are written as ```mermaid fences and render in the browser, so a
        # class or activity diagram is reviewed as a diff like everything else.
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite

plugins:
  - search
