# Read the Docs build. Mirrors what CI runs: `mkdocs build --strict`.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# `method: uv` allows exactly one install entry; `uv sync --group docs` installs the
# project and the docs group from uv.lock, so the site is built from pinned versions.
python:
  install:
    - method: uv
      command: sync
      groups:
        - docs

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
