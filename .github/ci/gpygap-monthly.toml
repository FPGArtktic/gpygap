# The monthly run: every project on the top list, on a GitHub-hosted runner.
#
# `extras = false` is not a shortcut, it is the only thing that fits. A standard
# runner has 14 GB of SSD and the full scope with extras is about 80 GB -- most of it
# the ML stack and its CUDA libraries, pulled in by extras of a handful of projects.
# Without them the same thousand projects come to roughly 25 GB, and the job frees
# what it can from the image before it starts.
#
# What this buys that the per-push scale run does not: a thousand projects resolved
# against the real index, every sdist among them that some target has no wheel for
# actually built, and the whole thing verified offline. Five thousand resolutions
# rather than two hundred, and an hour of uptime rather than three minutes -- which
# is where anything that only breaks after a while has to show up.
#
# The extras-inclusive 80 GB run belongs on a machine with a disk. See docs/ci.md.

[mirror]
output = "../../monthly-mirror"
state_dir = "../../monthly-mirror-state"

[packages]
top = 1000
extras = false
extra = [
    # pip itself must be mirrored: distro pip is often too old to read the PEP 658
    # sidecars this index serves (Debian 12 ships 23.0.1, which needs 23.1).
    "pip",
    #
    # Everything below publishes **no wheel at all** on PyPI, and the versions are
    # pinned so the set of builds CI performs is the same next month as today. Each
    # was checked to still compile on 3.11 through 3.14, on glibc and on musl.
    #
    # Pure Python: one build each, producing py3-none-any, which then covers every
    # target including Windows. This is the path that quietly closes most Windows
    # gaps, so it is worth having more than one example of.
    "docopt==0.6.2",
    "dockerpty==0.4.1",
    "termcolor2==0.0.3",
    #
    # C extensions: one build per platform and Python version, so these are what
    # give the builder actual volume -- roughly two dozen compilations per run.
    # llist is cross-platform, which is what leaves win-amd64 gaps for the Windows
    # runner to fill; the other two are Linux-only and exercise auditwheel on both
    # libc flavours.
    "llist==0.7.1",
    "pysendfile==2.0.1; sys_platform == 'linux'",
    "pyxattr==0.8.1; sys_platform == 'linux'",
]
sdists = "needed"

[targets]
python = ["3.11", "3.12", "3.13"]
platforms = ["linux-x86_64", "win-amd64"]

[sync]
with_tools = false
keep_runs = 1
verify = true
build_check = true
# One round, not two: at this size a second heal costs more time than it buys, and
# what it would have fixed is in MIRROR-GAPS.json either way.
heal_rounds = 1

[build]
wheels = true
jobs = 4

[security]
advisories = true
fail_on = "none"

[performance]
jobs = 8
download_jobs = 16
resolve_timeout = 900
