# Configuration for the CI end-to-end run. Deliberately tiny: the point is to exercise
# every stage (resolve, download, index, verify) and then prove, from real distro
# containers, that installing from the result needs no compiler and no network.
#
# Paths are relative to this file, so they land in the repository root.

[mirror]
output = "../../ci-mirror"
state_dir = "../../ci-mirror-state"

[packages]
top = 5
# pip itself must be mirrored: distro pip is often too old to read the PEP 658 sidecars
# this index serves (Debian 12 ships 23.0.1, which needs 23.1). In production the top
# list already includes pip; with top = 5 it has to be named.
extra = [
    # pip itself must be mirrored: distro pip is often too old to read the PEP 658
    # sidecars this index serves (Debian 12 ships 23.0.1, which needs 23.1).
    "pip",
    #
    # Everything below publishes **no wheel at all** on PyPI, and the versions are
    # pinned so the set of builds CI performs is the same next month as today. Each
    # was checked to still compile on 3.11 through 3.14, on glibc and on musl.
    #
    # Pure Python: one build each, producing py3-none-any, which then covers every
    # target including Windows. This is the path that quietly closes most Windows
    # gaps, so it is worth having more than one example of.
    "docopt==0.6.2",
    "dockerpty==0.4.1",
    "termcolor2==0.0.3",
    #
    # C extensions: one build per platform and Python version, so these are what
    # give the builder actual volume -- roughly two dozen compilations per run.
    # llist is cross-platform, which is what leaves win-amd64 gaps for the Windows
    # runner to fill; the other two are Linux-only and exercise auditwheel on both
    # libc flavours.
    "llist==0.7.1",
    "pysendfile==2.0.1; sys_platform == 'linux'",
    "pyxattr==0.8.1; sys_platform == 'linux'",
]
# Extras multiply the resolution count and pull in the ML stack; not what CI tests.
extras = false
# Only keep an sdist when some target has no wheel for it.
sdists = "needed"

[build]
# Wheels built on a machine this one cannot imitate are dropped here; the Windows
# runner fills it between the two mirror passes. Absent on the first pass, which
# is exactly how it behaves in production before a Windows builder exists.
external_dir = "../../ci-windows-wheels"

[targets]
# The Python versions the distro images in consume-linux ship, plus one ahead:
# Debian 12 -> 3.11, UBI 9 -> 3.12, Alpine 3.20 -> 3.12, Arch -> 3.13 (rolling).
python = ["3.11", "3.12", "3.13", "3.14"]
# musl is in here because the Alpine leg of consume-linux is a real target, not a
# curiosity: a manylinux wheel does not install there.
platforms = ["linux-x86_64", "linux-musl-x86_64", "win-amd64"]

[sync]
# uv archives and python-build-standalone builds are hundreds of MB and the runners
# already have both.
with_tools = false
keep_runs = 1

[security]
# The scan is a 36 MB download and a few seconds; worth having in CI so the code path
# is exercised, but never a reason for a red build.
advisories = true
fail_on = "none"

[performance]
jobs = 4
download_jobs = 8
