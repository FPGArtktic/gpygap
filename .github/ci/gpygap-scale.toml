# A bigger run, for the things only volume finds.
#
# The consume jobs install from the small mirror, because that artifact is
# downloaded about twenty times and every megabyte is paid for twenty times over.
# This one is never uploaded: it exists to resolve ten times as many projects, build
# whatever among them ships no wheel, and say whether the result is COMPLETE.
#
# Roughly 620 MB and a few minutes. Not the top 1000 -- that is 80 GB and over an
# hour, which belongs in a scheduled run, not on every push -- but enough that a
# resolver edge case, a build that times out, or an engine that is not there has
# somewhere to show up before an operator finds it.

[mirror]
output = "../../scale-mirror"
state_dir = "../../scale-mirror-state"

[packages]
top = 50
# Extras are where the gigabytes are (the ML stack and its CUDA libraries); the
# small mirror does not have them either.
extras = false
# The same pinned set the small mirror builds, so volume here is resolution
# volume on top of it rather than instead of it.
extra = [
    # pip itself must be mirrored: distro pip is often too old to read the PEP 658
    # sidecars this index serves (Debian 12 ships 23.0.1, which needs 23.1).
    "pip",
    #
    # Everything below publishes **no wheel at all** on PyPI, and the versions are
    # pinned so the set of builds CI performs is the same next month as today. Each
    # was checked to still compile on 3.11 through 3.14, on glibc and on musl.
    #
    # Pure Python: one build each, producing py3-none-any, which then covers every
    # target including Windows. This is the path that quietly closes most Windows
    # gaps, so it is worth having more than one example of.
    "docopt==0.6.2",
    "dockerpty==0.4.1",
    "termcolor2==0.0.3",
    #
    # C extensions: one build per platform and Python version, so these are what
    # give the builder actual volume -- roughly two dozen compilations per run.
    # llist is cross-platform, which is what leaves win-amd64 gaps for the Windows
    # runner to fill; the other two are Linux-only and exercise auditwheel on both
    # libc flavours.
    "llist==0.7.1",
    "pysendfile==2.0.1; sys_platform == 'linux'",
    "pyxattr==0.8.1; sys_platform == 'linux'",
]
sdists = "needed"

[targets]
python = ["3.11", "3.12", "3.13", "3.14"]
platforms = ["linux-x86_64", "linux-musl-x86_64", "win-amd64"]

[sync]
with_tools = false
keep_runs = 1
verify = true
build_check = true
heal_rounds = 2

[build]
wheels = true
jobs = 4

[security]
advisories = true
fail_on = "none"

[performance]
jobs = 8
download_jobs = 16
