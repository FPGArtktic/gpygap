# A Windows online machine, as far as a GitHub-hosted runner can imitate one.
#
# What this proves: gpygap assembles a working mirror when the machine driving it is
# Windows -- resolution, selection, download, the simple index, checksums and the
# offline verification, all over Windows paths and file:// URLs. That is where the
# portability risk actually lives, and nothing else tests it.
#
# It also builds the win_amd64 wheels itself, in process, because on Windows there is
# no container that would help: a Windows wheel needs MSVC and MSVC needs Windows.
#
# What it cannot prove: building the Linux wheels on this host. That needs Linux
# containers, and a GitHub-hosted Windows runner has Docker in Windows-container mode
# and no Docker Desktop. A real Windows online machine with the WSL2 backend does both
# halves in one run; see docs/online-on-windows.md.

[mirror]
output = "../../win-mirror"
state_dir = "../../win-mirror-state"

[packages]
top = 3
extras = false
# A C extension with no wheels on PyPI: the Windows host has to compile it, which is
# the half of the arrangement nothing else tests.
extra = ["llist"]
sdists = "needed"

[targets]
python = ["3.12", "3.13"]
platforms = ["win-amd64"]

[sync]
with_tools = false
keep_runs = 1
# The build check wants a container it does not have here; the wheel build below is
# the stronger statement anyway, since it keeps what it produced.
build_check = false
verify = true
heal_rounds = 1

[build]
# On Windows this means the host toolchain, not a container. It is the one place the
# project builds an sdist outside one, because there is no alternative -- and it is
# the exposure a developer takes anyway when pip builds from source, which is exactly
# what mirroring the wheel saves them from.
wheels = true

[security]
# One scan is exercised in the Linux jobs; no need to download the archive twice.
advisories = false

[performance]
jobs = 4
download_jobs = 8
