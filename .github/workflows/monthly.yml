#
# Once a month, the whole top list. The per-push jobs run five projects and fifty;
# this one runs a thousand, which is where resolution volume, build volume and an
# hour of uptime can break things that three minutes cannot.
#
# It is the monthly cadence the tool is built around, not a nightly: a mirror is
# re-synchronised monthly, so a monthly run is the one that matches what operators
# will actually hit.
name: Monthly

on:
  schedule:
    - cron: "0 3 1 * *"      # 03:00 UTC on the first of the month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  top-1000:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5

      - name: Make room
        # A standard runner has 14 GB of SSD and this needs roughly 25 GB. The
        # preinstalled toolchains nothing here uses are worth about 25 GB between
        # them; df before and after, so the next person sizing this has real numbers
        # rather than a guess.
        run: |
          echo "### before" && df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "### after" && df -h / | tail -1

      - name: What it would cost, before paying it
        # Resolution only, no downloads. If the plan does not fit the disk, say so in
        # a minute rather than failing an hour in with a confusing ENOSPC.
        run: |
          bin/gpygap sync --config .github/ci/gpygap-monthly.toml --plan-only \
            | tee "$RUNNER_TEMP/plan.log"
          planned=$(grep -oE 'mirror would hold [0-9]+ files \(([0-9.]+) [KMG]B\)' "$RUNNER_TEMP/plan.log" | tail -1)
          free=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "planned: $planned | free: ${free}G"
          echo "- $planned, ${free} GB free" >> "$GITHUB_STEP_SUMMARY"

      - name: The whole top list
        run: bin/gpygap sync --config .github/ci/gpygap-monthly.toml | tee "$RUNNER_TEMP/sync.log"

      - name: What it found
        if: always()
        run: |
          {
            echo "### Monthly top-1000"
            echo '```'
            tr -d '\r' < "$RUNNER_TEMP/sync.log" | grep -E '^I (Mirror [0-9]|Downloaded|Pruned|Top projects|Install checks|Build checks|Built |Mirror is|Advisories)' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The gap list is not silently empty
        if: always()
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys
          path = pathlib.Path("monthly-mirror/MIRROR-GAPS.json")
          if not path.is_file():
              sys.exit("no MIRROR-GAPS.json: the run did not get far enough to publish one")
          gaps = json.loads(path.read_text())["gaps"]
          reasons = sorted({g["reason"] for g in gaps})
          print(f"{len(gaps)} gaps, reasons: {reasons or 'none'}")
          if "no-engine" in reasons:
              sys.exit("the container engine was not reachable; nothing was built")
          EOF

      - name: Keep the report, not the mirror
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp monthly-mirror/MIRROR-GAPS.json monthly-mirror/MIRROR-ADVISORIES.json \
             monthly-mirror/MIRROR-INFO.json "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp monthly-mirror-state/logs/*-report.json "$RUNNER_TEMP/out/" 2>/dev/null || true
          cp monthly-mirror-state/logs/*-errors.log "$RUNNER_TEMP/out/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monthly-report
          path: ${{ runner.temp }}/out
          if-no-files-found: warn
          retention-days: 90
