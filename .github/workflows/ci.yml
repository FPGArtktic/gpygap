# SPDX-License-Identifier: GPL-3.0-or-later
#
# The interesting jobs are the last two: they build a real (tiny) mirror and then install
# from it inside Debian, RHEL, Arch and Alpine containers with the network switched off,
# and on a Windows runner. That is the guarantee gpygap exists to give, tested rather
# than asserted.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Release gates on this exact workflow rather than a copy of it.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GPYGAP_ENGINE: docker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen mypy

  unit:
    # Windows is in here, not only in the consume jobs. The unit suite is full of
    # path handling -- mirror-relative POSIX paths, file:// index URLs, temporary
    # directories -- and a separator assumption is exactly the kind of bug that
    # passes on Linux and greets a developer in Warsaw on a Monday. Coverage is
    # collected on every leg; it is not Linux-specific either.
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          # The ends of the range on Linux only; Windows runs the two versions
          # developers there actually have.
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - name: Install uv (Linux)
        if: runner.os == 'Linux'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install uv (Windows)
        if: runner.os == 'Windows'
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: powershell
      - name: Tests with coverage
        run: uv run --python ${{ matrix.python }} pytest -q --cov-report=term-missing:skip-covered
      - name: Coverage into the job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage — ${{ matrix.os }}, Python ${{ matrix.python }}"
            echo
            echo '```'
            uv run --python ${{ matrix.python }} coverage report --skip-covered 2>/dev/null | tail -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  offline-py39:
    # offline.py ships to the air-gapped side on its own and must run on the oldest
    # Python a server there might have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bin/check-offline-py39

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: uv run --frozen --group docs mkdocs build --strict
      - name: Render every diagram
        # mkdocs --strict cannot see inside a ```mermaid fence, so a diagram that
        # does not parse reaches the published site as "Syntax error in text" and
        # is noticed by a reader. Rendering them here is the only check there is.
        run: |
          python3 .github/ci/extract-mermaid.py docs "$RUNNER_TEMP/mermaid"
          printf '%s\n' '{"args": ["--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage"]}' \
            > "$RUNNER_TEMP/puppeteer.json"
          failed=0
          for diagram in "$RUNNER_TEMP"/mermaid/*.mmd; do
            if npx -y @mermaid-js/mermaid-cli@11 -p "$RUNNER_TEMP/puppeteer.json" \
                 -i "$diagram" -o "$diagram.svg" >/dev/null 2>"$diagram.err"; then
              echo "ok   $(basename "$diagram")"
            else
              echo "FAIL $(basename "$diagram")"
              sed -n '1,12p' "$diagram.err"
              failed=1
            fi
          done
          exit $failed

  mirror:
    # Builds the tiny CI mirror the consume-* jobs install from.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build the mirror
        run: bin/gpygap sync --config .github/ci/gpygap.toml
      - name: Pack it
        # One tarball instead of tens of thousands of small files: the artifact
        # upload is minutes faster and the layout survives on Windows.
        run: tar -czf "$RUNNER_TEMP/ci-mirror.tar.gz" -C ci-mirror .
      - uses: actions/upload-artifact@v4
        with:
          name: ci-mirror
          path: ${{ runner.temp }}/ci-mirror.tar.gz
          retention-days: 1

  wheels-windows:
    # The one gap a Linux host cannot close itself. windows-latest has MSVC, so it
    # reads MIRROR-GAPS.json, builds exactly those sdists, and hands the wheels back.
    needs: mirror
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-mirror
          path: ${{ runner.temp }}
      - name: Unpack the mirror
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\mirror" | Out-Null
          tar -xzf "$env:RUNNER_TEMP\ci-mirror.tar.gz" -C "$env:RUNNER_TEMP\mirror"
      - name: Build what the mirror could not
        shell: bash
        run: python -I .github/ci/build-windows-wheels.py "$RUNNER_TEMP/mirror" "$RUNNER_TEMP/wheels"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-wheels-${{ matrix.python }}
          path: ${{ runner.temp }}/wheels
          retention-days: 1

  mirror-merge:
    # Second pass: the same sync, with build.external_dir now holding what Windows
    # built. This is the production shape too -- one run publishes the gaps, a
    # Windows builder fills them, the next run folds them in.
    needs: wheels-windows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-wheels-*
          merge-multiple: true
          path: ci-windows-wheels
      - name: Rebuild the mirror with the Windows wheels folded in
        run: bin/gpygap sync --config .github/ci/gpygap.toml
      - name: Pack it
        run: tar -czf "$RUNNER_TEMP/ci-mirror.tar.gz" -C ci-mirror .
      - uses: actions/upload-artifact@v4
        with:
          name: ci-mirror-merged
          path: ${{ runner.temp }}/ci-mirror.tar.gz
          retention-days: 1

  mirror-windows:
    # Can a Windows machine be the online side at all? Every other job drives gpygap
    # from Linux, so nothing else would notice a path separator, a drive letter or a
    # file:// URL that only works on POSIX. This job runs the tool natively on Windows
    # and then installs from what it produced.
    #
    # It deliberately mirrors a handful of wheel-only packages: a GitHub-hosted Windows
    # runner has Docker in Windows-container mode and no Docker Desktop, so there is no
    # Linux container to build an sdist in -- and building one outside a container is
    # running code from the internet on the host, which this project does not do. A real
    # Windows online machine with the WSL2 backend does both halves; see
    # docs/online-on-windows.md.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: powershell
      - name: Build a mirror, driven from Windows
        run: uv run --frozen gpygap sync --config .github/ci/gpygap-windows.toml
      - name: Install from it, offline
        shell: bash
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: |
          if python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/simple/', timeout=20)" 2>/dev/null; then
            echo "pypi.org was reachable: this job proves nothing" >&2
            exit 1
          fi
          python -I win-mirror/gpygap_offline.py verify win-mirror
          python -I .github/ci/consume.py win-mirror win-amd64 pip,uv

  # Round one: can every system install from what Linux alone could build?
  consume-after-linux:
    needs: mirror
    uses: ./.github/workflows/consume.yml
    with:
      artifact: ci-mirror
      phase: Linux built it

  # Round two: the same seven distributions and Windows again, from scratch,
  # against the mirror after a Windows runner supplied what Linux could not.
  # More packages must install this time, not merely the same ones.
  consume-after-windows:
    needs: mirror-merge
    uses: ./.github/workflows/consume.yml
    with:
      artifact: ci-mirror-merged
      phase: Windows built its share
      expect-windows-built: true
