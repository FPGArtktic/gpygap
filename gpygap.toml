# Configuration of the offline PyPI mirror.
#
# Every key is optional; the values below are the defaults. Unknown keys are
# rejected, so a typo fails loudly. Relative paths are relative to this file.

[mirror]
# Directory to serve over HTTP and to carry into the air-gapped network.
output = "gpygap"
# Caches, logs and run history. Stays on the online machine; never copy it offline.
state_dir = "gpygap-state"
# uv's cache used while building the mirror (default: <state_dir>/uv-cache).
# uv_cache_dir = "/var/cache/gpygap-uv"
# uv executable.
uv = "uv"

[packages]
# How many of the most downloaded PyPI projects to mirror.
top = 1000
# Where the ranking comes from (format of hugovk/top-pypi-packages); first reachable wins.
top_sources = [
    "https://hugovk.github.io/top-pypi-packages/top-pypi-packages.min.json",
    "https://raw.githubusercontent.com/hugovk/top-pypi-packages/main/top-pypi-packages.min.json",
]
# Additional requirements, always mirrored (any PEP 508 requirement).
extra = []
# Our own list of packages to mirror on top of the top list; see the file's header.
extra_file = "packages.txt"
# Projects never mirrored; the next project in the ranking takes their place.
exclude = []
# Mirror every extra (`uvicorn[standard]`, `requests[socks]`...) of the top projects,
# packages.txt and intake requirements files, each resolved on its own.
extras = true
# Extras to skip, by name, for every project (e.g. ["dev", "docs", "test"]).
extras_exclude = []
# Directory where teams drop uv.lock, pylock*.toml or requirements*.txt files;
# everything in them is mirrored and checked, including old pinned versions.
requirements_dir = "intake"
# Source distributions: "all", "needed" (only when some target has no wheel), "none".
sdists = "all"

[targets]
# CPython versions developers use.
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]
# Available: linux-x86_64, linux-aarch64, win-amd64, win-arm64, macos-arm64, macos-x86_64
platforms = ["linux-x86_64", "win-amd64"]

[upstream]
# Index to mirror from (e.g. a company proxy of PyPI).
index_url = "https://pypi.org/simple"

[sync]
# Keep files required by any of the last N runs. 1 behaves like `rsync --delete`:
# a project that drops out of the top list disappears with its dependencies.
# 2 gives developers one sync period to move off removed versions.
keep_runs = 1
# Refuse to delete more than this share of the mirror in one run (safety net).
max_prune_ratio = 0.5
# Set to false to never delete anything.
prune = true
# Rounds of mirroring build requirements of sdists that some target must build.
build_deps_rounds = 3
# Also mirror uv binaries and Python interpreters for the target platforms.
with_tools = true
# Check every requirement x Python x platform against the finished index, offline,
# like a developer's uv would. The mirror is only called complete if nothing fails
# that works upstream.
verify = true
# Build every sdist some target must build, offline, to prove its build
# requirements (including ones requested at build time) are in the mirror.
build_check = true
# How many times to fetch what the checks found missing and check again.
heal_rounds = 2

[build]
# Build a wheel for every target an sdist has no upstream wheel for, so that nothing
# is compiled on a developer machine in the air-gapped network. Builds run in sibling
# containers (pypa manylinux/musllinux images) with the network off; bin/gpygap passes
# the container engine socket in. Turn this off and such targets are reported as gaps
# and the sdist is shipped instead, the way it worked before.
wheels = true
# Client used to launch the builder containers. The image ships the docker CLI, which
# drives podman's API socket as well as docker's.
engine = "docker"
# Wheels built on a machine this one cannot imitate (a Windows host, a CI runner)
# are dropped here and adopted on the next run; see docs/wheels.md.
# external_dir = "incoming-wheels"
# When the container engine lives on a different kind of host than this process --
# Docker Desktop on Windows, where the mirror is /work/gpygap in here and C:\gpygap
# out there -- these translate paths for the sibling containers. Both or neither.
# container_root = "/work"
# host_root = "C:\\gpygap"
# Override the builder image of a platform: "platform-key=image". Defaults come from
# the platform itself and are pinned, so the libc floor cannot drift between runs.
# images = ["linux-x86_64=quay.io/pypa/manylinux_2_28_x86_64:2026.10.10-1"]
images = []
# Projects never built locally, by name.
exclude = []
# Parallel sdists being built. Each one builds its targets in sequence, because the
# first build is often py3-none-any, which covers all of them.
jobs = 2
# Seconds allowed for one wheel build.
timeout = 1800

[security]
# Match everything the mirror publishes against the OSV advisory set and write the
# result to MIRROR-ADVISORIES.json, which travels with the mirror: the people who
# cannot query an API are the ones who most need the list. A snapshot at build time,
# and advisory data has false positives and gaps -- it is a report, not a gate.
advisories = true
# Where the advisory set comes from (one zip per ecosystem); first reachable wins,
# and an unreachable source falls back to the cached copy rather than scanning nothing.
osv_sources = [
    "https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip",
]
# Fail the run when something at or above this severity is found:
# "none", "low", "moderate", "high" or "critical". Mirroring the top 1000 projects
# will always find something, so this is off by default.
fail_on = "none"

[performance]
# Parallel uv resolutions.
jobs = 8
# Parallel downloads.
download_jobs = 16
# Attempts per resolution (downloads get two more).
retries = 2
# Seconds allowed for one resolution.
resolve_timeout = 900
# Seconds allowed for one offline sdist build in the build check.
build_timeout = 600
# Resolutions younger than this are reused, so an interrupted run resumes quickly.
max_age_hours = 20
